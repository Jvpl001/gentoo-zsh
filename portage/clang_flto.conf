CC="clang"
CXX="clang++"

# -fdata-sections & -ffunction-sections isolate code blocks so the linker can strip dead code.
COMMON_FLAGS="-O3 -pipe -march=haswell -mtune=haswell -fno-plt -D_FORTIFY_SOURCE=3 -flto=full -fdata-sections -ffunction-sections"

CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"

# -fuse-ld=lld uses LLVM's linker.
# -Wl,--gc-sections drops the dead code isolated by the CFLAGS.
# -Wl,-icf=all (Identical Code Folding) merges identical functions to shrink the binary.
LDFLAGS="-Wl,-O2 -Wl,--as-needed -Wl,-z,pack-relative-relocs -Wl,-z,now -Wl,-z,relro -flto=full -fuse-ld=lld -Wl,--gc-sections -Wl,-icf=all"
